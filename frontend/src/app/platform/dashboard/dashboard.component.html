<div class="dashboard">
  <header class="page-head">
    <div class="page-title">
      <span class="eyebrow">Platform</span>
      <h1>Overview</h1>
      <p>Every workspace on this deployment, at a glance.</p>
    </div>

    <button mat-stroked-button class="btn-outline" (click)="loadSummary()" [disabled]="isLoading">
      <mat-icon>refresh</mat-icon>
      Refresh
    </button>
  </header>

  <div class="loader-wrap" *ngIf="isLoading">
    <app-page-loader></app-page-loader>
  </div>

  <section class="cards" *ngIf="!isLoading && summary">
    <mat-card class="stat-card" *ngFor="let card of cards" [ngClass]="card.tone">
      <span class="card-icon">
        <mat-icon>{{ card.icon }}</mat-icon>
      </span>
      <div class="value">{{ value(card.key) }}</div>
      <div class="label">{{ card.label }}</div>
    </mat-card>
  </section>

  <div class="empty" *ngIf="!isLoading && !summary">
    <mat-icon>cloud_off</mat-icon>
    <p>No summary available yet.</p>
  </div>
</div>
